<text x="1664" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="start">Xem nhóm cần kiểm tra</text>
<text x="1574" y="392" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Theo công đoạn, bang khách hàng, seller của</text><text x="1574" y="423" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">đơn một seller</text><text x="1574" y="454" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Số lượng / tỷ lệ kèm mẫu số</text><text x="1574" y="485" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Nhóm nhỏ được ghi chỉ tham khảo</text>
<rect x="1537" y="243" width="45" height="45" rx="8" fill="#DEFA18" stroke="#183042" stroke-width="1.8"/>
<text x="1559.5" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="middle">3</text>
</g>
