<text x="224" y="802" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="start">Đề xuất kiểm tra và hỗ trợ</text><text x="224" y="836" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="start">quyết định</text>
<text x="134" y="908" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Đề xuất từ phản hồi AI đã kiểm chứng khi có</text><text x="134" y="939" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Người quản lý quyết định; chưa đánh giá hiệu</text><text x="134" y="970" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">quả sử dụng</text>
<rect x="97" y="743" width="45" height="45" rx="8" fill="#DEFA18" stroke="#183042" stroke-width="1.8"/>
<text x="119.5" y="774.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="middle">6</text>
</g>
<rect x="65" y="1157" width="33" height="22" rx="4" fill="#FFFFFF" stroke="#668094" stroke-width="2"/>
<text x="110" y="1175.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526577" text-anchor="start">Có triển khai / kết quả</text>
<rect x="485" y="1157" width="33" height="22" rx="4" fill="#F6FBF8" stroke="#447964" stroke-width="2"/>
<text x="530" y="1175.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526577" text-anchor="start">Đầu ra</text>
<rect x="905" y="1157" width="33" height="22" rx="4" fill="#FFF9EE" stroke="#A0762A" stroke-width="2" stroke-dasharray="7 5"/>
<text x="950" y="1175.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526577" text-anchor="start">Chưa hoàn tất</text>
<rect x="1325" y="1157" width="33" height="22" rx="4" fill="#FFF5F3" stroke="#AE5E4B" stroke-width="2"/>
<text x="1370" y="1175.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526577" text-anchor="start">Chưa đủ điều kiện</text>
<text x="65" y="1223.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526577" text-anchor="start">Đã có bản local; chỉ hiển thị giải thích AI với đầu ra đã qua kiểm tra. Kết quả lấy từ hồ sơ đã lưu.</text>
<text x="65" y="1254.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526577" text-anchor="start">So sánh seller/khu vực phải kèm số đơn, mẫu số, bối cảnh và giới hạn; không quy kết nguyên nhân.</text>
<text x="65" y="1285.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526577" text-anchor="start">Không tuyên bố mọi chức năng phân tích sâu hoặc hiệu quả quản trị đã được hoàn thiện / kiểm chứng.</text>
<text x="2115" y="1394.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526577" text-anchor="end">KLTN-Lon2G · 09/11/2026 · Số vàng là mã khối trong hình, không phải số hình của báo cáo.</text>
