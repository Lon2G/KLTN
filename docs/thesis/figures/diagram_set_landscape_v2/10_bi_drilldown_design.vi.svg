<text x="1664" y="802" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="start">Xem đơn trong nhóm</text>
<text x="1574" y="892" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Giữ đơn giao sớm có cảnh báo</text><text x="1574" y="923" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Tách điểm công đoạn với giao trễ hẹn</text><text x="1574" y="954" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Hiển thị lý do chưa đánh giá</text>
