<text x="944" y="802" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183042" text-anchor="start">Xem bằng chứng của đơn</text>
<text x="854" y="892" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Mốc thực tế · thời lượng · trung bình / số mẫu</text><text x="854" y="923" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">/ cấp tham chiếu · điểm</text><text x="854" y="954" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Hiển thị nhận định AI đã kiểm chứng khi có</text><text x="854" y="985" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">đầu ra lưu sẵn</text>
