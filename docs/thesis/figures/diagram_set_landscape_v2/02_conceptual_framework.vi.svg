<text x="65" y="1239.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526577" text-anchor="start">Tác giả tổng hợp theo thiết kế đề tài; hình không thay thế trích dẫn lý thuyết.</text>
<text x="65" y="1270.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526577" text-anchor="start">Khung khái niệm; quan hệ trong hình không chứng minh quan hệ nhân quả.</text>
