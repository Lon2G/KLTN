<text x="2294" y="908" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Tổng hợp nhóm cần chú ý → xem đơn →</text><text x="2294" y="939" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">xem bằng chứng</text><text x="2294" y="970" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">Trình bày kết quả đã lưu; chưa kiểm chứng</text><text x="2294" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#183042" text-anchor="start">vận hành thực tế</text>
